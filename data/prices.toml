# ---- Anthropic: https://platform.claude.com/docs/en/about-claude/pricing (Model pricing and
# Long context pricing sections); model ID from https://platform.claude.com/docs/en/about-claude/models/overview

[[price]]
provider = "anthropic"
model = "claude-haiku-5-5"
effective_from = 2026-10-31
threshold_tokens = 100000
boundary = "at_or_below"
applies_to = "whole_request"
input_per_mtok = 0.10
output_per_mtok = 0.50
input_per_mtok_above = 0.50
output_per_mtok_above = 2.50
source_url = "https://platform.claude.com/docs/en/about-claude/pricing"
as_of = 2026-10-31
tier = "A"
shelf_life_days = 30
notes = "Page rows: 'for prompts up to 100,000 tokens' $0.10 in and $0.50 out; 'for prompts over 100,000 tokens' $0.50 in and $2.50 out. The page says a request whose prompt is over 100,000 tokens pays higher prices and that prompt length counts all input tokens including cache reads and writes, so input_tokens in the usage export should include them. The page does not use the words whole request; applies_to follows its statement that the request pays the higher prices. No start date given; effective_from is the check date."
