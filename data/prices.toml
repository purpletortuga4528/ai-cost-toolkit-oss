# Seed prices for aicost. Content license: CC BY 4.0 (see LICENSE-CONTENT).
#
# Every row was read from the provider's own pricing page on its as_of date (2026-10-31).
# Rates are US dollars per million tokens, Standard (not batch or flex) paid-tier text
# prices. Cache, batch, tool, and regional-processing prices are not in this table.
#
# Rows left out on purpose, with the reason:
# - Gemini 3.1 Pro Preview and Gemini 2.5 Pro have a 200k-token band ("prompts <= 200k
#   tokens"), but the pricing page does not say whether the higher rate covers the whole
#   request or only the tokens beyond 200k, and applies_to may not be guessed.
# - OpenAI: the pricing page offers a Short/Long context toggle, but only the Short tables
#   could be read, so no threshold or Long rate could be checked.
#
# effective_from note: the pages state when a current price ends or changes, not when it
# began, so each current row uses its check date (2026-10-31) as effective_from.
schema_version = 1

