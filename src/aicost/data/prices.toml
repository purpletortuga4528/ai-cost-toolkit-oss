# Seed prices for aicost. Content license: CC BY 4.0 (see LICENSE-CONTENT).
#
# Every row was read from the provider's own pricing page on its as_of date (2026-10-31,
# and 2026-11-01 for the four Claude Opus and Sonnet rows).
# Rates are US dollars per million tokens, Standard (not batch or flex) paid-tier text
# prices. Cache, batch, tool, and regional-processing prices are not in this table.
#
# Banded rows and where each rule comes from (checked 2026-10-31):
# - Anthropic: the pricing page states the 100,000-token rule.
# - OpenAI: the pricing page toggle reads "Short: <=272K input tokens" and "Long: >272K input
#   tokens"; each model's own page says prompts over 272K are priced at 2x input and 1.5x
#   output "for the full request" (GPT-5.5 and GPT-5.4 say "full session"). No page defines
#   "K"; 272K is read here as 272,000. Upper rates are 2x and 1.5x the short rates, computed
#   from that wording. The pricing page labels some short rows "(<272K context length)",
#   which disagrees with its "<=272K" toggle; the toggle and the model pages agree and are
#   followed.
# - Gemini 3.1 Pro Preview and Gemini 2.5 Pro: the Gemini API pricing page shows a 200k band
#   ("prompts <= 200k tokens") but is silent on whole request versus marginal, as are its
#   long-context, billing, tokens, caching, and model pages. Google's separate Vertex AI
#   pricing page (https://cloud.google.com/vertex-ai/generative-ai/pricing) says "If a query
#   input context is longer than 200K tokens, all tokens (input and output) are charged at
#   long context rates", with the same Pro rates. The owner decided on 2026-10-31 to use
#   that wording for these two rows. This is the one place where the rule comes from a
#   different Google product than the rates. "200k" is read as 200,000. These two rows are
#   tier B for that reason: the rates are from the Gemini API page, but the whole-request
#   rule is from the Vertex AI page, a different Google product.
# - "K" is read as 1,000 throughout (272K is 272,000 and 200k is 200,000).
#
# effective_from note: the pages state when a current price ends or changes, not when it
# began, so each current row uses its check date as effective_from.
schema_version = 1

