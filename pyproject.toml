[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cost-toolkit"
version = "0.1.0.dev0"
description = "Check what share of your AI API spend sits above each provider's long-context price threshold."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-CONTENT"]
dependencies = []

[project.scripts]
aicost = "aicost.cli:main"

[tool.setuptools.package-data]
aicost = ["data/*.toml"]
